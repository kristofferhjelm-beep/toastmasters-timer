/* v2.1: High-contrast light interface; the live signal palette remains unchanged. */
:root{color-scheme:light;color:#14243b;background:#f1f5f9}
body{background:#f1f5f9;color:#14243b}
.brand,h1,h2,.personName,.inlineTitle,.saveTime{color:#13243d}
.tiny,.intro,.foot,.switchNote,.personSub,.order{color:#475569}
.eyebrow{color:#1d4ed8}
.panel{background:#fff;border-color:#cbd5e1;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.tag{background:#e5edff;color:#1e40af}
.logo{background:#dbeafe;color:#1e3a8a}
.nav button{background:#fff;color:#1f3551;border-color:#aebfd4}
.nav button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.field,.custom label{color:#334155}
input,select{background:#fff;border-color:#94a3b8;color:#0f172a}
input::placeholder{color:#64748b}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
.button{background:#1d4ed8;color:#fff}
.button.alt{background:#dbeafe;color:#15376d}
.button.ghost{background:#fff;color:#1e40af;border-color:#94a3b8}
.button.danger{background:#fee2e2;color:#991b1b}
.person{background:#f8fafc;border-color:#cbd5e1}
.x{color:#334155}
.empty{border-color:#94a3b8;color:#475569}
.sectionLabel{color:#1e293b}
.topicHero{background:linear-gradient(135deg,#e0f2fe,#dbeafe);border-color:#93c5fd}
.topicHero p{color:#334155}
.choice button,.resultChips button{background:#eff6ff;color:#1e3a8a;border-color:#93b4de}
.choice button.selected{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.signalTimes>div{background:#f1f5f9;color:#334155;border:1px solid #d7e0eb}
.signalTimes b{color:#0f172a}
.reportHeading{color:#1e40af}
.reportItem{border-color:#cbd5e1;color:#14243b}
.reportItem button{color:#334155}
.status{color:#334155}
.warning{color:#92400e}
/* Preserve solid color backgrounds in timing mode */
.signal.neutral{background:#141c2c}.signal.green{background:#12984e}.signal.yellow{background:#ffd029}.signal.red{background:#e22929}
.signal .clock{color:rgba(255,255,255,.95)}.signal.yellow .clock{color:#111827}

/* v2.5: user-supplied Toastmasters logo and club name on neutral screen */
.signal.neutral{background:#004165;color:#fff}
.signal.neutral .clock{color:#fff}
.signal .neutral-brand{display:none}
.signal.neutral .neutral-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;pointer-events:none;padding:24px;text-align:center}
.neutral-brand [hidden]{display:none!important}
.neutral-brand img{width:min(70vw,60vh,520px);height:auto;display:block}
.neutral-brand .club-name{margin-top:22px;font-size:clamp(24px,4vw,44px);line-height:1.2;font-weight:800;text-align:center;color:#fff;max-width:min(90vw,1000px);text-wrap:balance}
.signal.overtime-red{background:#e22929}
.signal.overtime-black{background:#000}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="logo.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><main id="app"></main><script>
const TYPES={speech:{label:'Prepared Speech',category:'Speakers',g:300,y:360,r:420},ice:{label:'Ice Breaker',category:'Speakers',g:240,y:300,r:360},eval:{label:'Evaluation',category:'Evaluators',g:120,y:150,r:180},topics:{label:'Table Topics',category:'Table Topics',g:60,y:90,r:120},general:{label:'General Evaluation',category:'General Evaluators',g:120,y:150,r:180}};
const CATS=['Speakers','Evaluators','Table Topics','General Evaluators'];
const store=(key,fallback)=>{try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
const historic=store('tm-speakers-v1',[]).map(x=>typeof x==='string'?{name:x,category:'Speakers'}:x).filter(x=>x&&CATS.includes(x.category)&&typeof x.name==='string');
let roster=store('tm-meeting-roster-v2',null);if(!roster||typeof roster!=='object')roster={Speakers:[],Evaluators:[]};for(let c of ['Speakers','Evaluators'])if(!Array.isArray(roster[c]))roster[c]=[];
let library=historic, oldPresets=store('tm-demo-presets',[]);let limits={};for(let k of Object.keys(TYPES)){let matching=oldPresets.find(x=>x.id===k);limits[k]={g:matching?.g??TYPES[k].g,y:matching?.y??TYPES[k].y,r:matching?.r??TYPES[k].r}};
let entries=store('tm-demo-entries',[]).map(e=>({...e,category:e.category||CATS.find(c=>c===e.type)||({speech:'Speakers',ice:'Speakers',eval:'Evaluators',topics:'Table Topics',general:'General Evaluators'}[e.type])||'Speakers'}));let page='setup',type='speech',chosen='',newNames={Speakers:'',Evaluators:''},current=0,started=0,finished=0,tick=null,lastTap=0,awake=null,customType='speech';
const el=id=>document.getElementById(id),format=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.max(0,n)%60).padStart(2,'0')}`,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('tm-meeting-roster-v2',JSON.stringify(roster));localStorage.setItem('tm-demo-entries',JSON.stringify(entries));localStorage.setItem('tm-speakers-v1',JSON.stringify(library));localStorage.setItem('tm-demo-presets',JSON.stringify(Object.entries(limits).map(([id,v])=>({id,...v}))))}
function remember(n,c){if(n&&!library.some(x=>x.category===c&&x.name.toLowerCase()===n.toLowerCase()))library.push({name:n,category:c})}

function configure(k,who=''){type=k;chosen=who;page='ready';render()}

function stop(){if(page!=='signal')return;finished=Math.floor((performance.now()-started)/1000);clearInterval(tick);awake?.release?.().catch(()=>{});page='result';render()}

function eraseReport(){if(confirm('Clear recorded times for this meeting? This will not delete your planned speakers.')){entries=[];persist();render()}}
function resetMeeting(){if(confirm('Clear today’s planned Speakers and Evaluators? Your saved name library will remain available.')){roster={Speakers:[],Evaluators:[]};persist();render()}}

if(page==='setup'){body=`<div class="eyebrow">BEFORE THE MEETING</div><h1>Prepare your meeting</h1><p class="intro">Add today's prepared speakers and evaluators. Names stay on this device, and you can change the lineup at any time.</p>${plannedSection('Speakers')}${plannedSection('Evaluators')}<section class="panel"><div class="panelHead"><h2>Start prepared sessions</h2></div><p class="intro">Select a planned participant to start with their timing preset.</p><div class="rows">${['Speakers','Evaluators'].flatMap(c=>roster[c].map(x=>`<button class="button alt" style="text-align:left" onclick="configurePlanned('${c}','${x.id}')">▶ ${esc(x.name)} <span style="opacity:.6">· ${x.type==='ice'?'Ice Breaker':c==='Speakers'?'Speech':'Evaluation'}</span></button>`)).join('')||'<div class="empty">Add a speaker or evaluator above to see quick start buttons.</div>'}</div><button class="button ghost wide" onclick="configure('general')">General Evaluator →</button><button class="button ghost wide" onclick="configure('speech')">Start without a name →</button></section><button class="button danger wide" onclick="resetMeeting()">Clear planned lineup</button>`}
if(page==='topics'){body=`<div class="eyebrow">SPONTANEOUS SPEAKING</div><h1>Table Topics</h1><p class="intro">A separate quick-timing area. Start immediately, then choose or add the participant's name after the speech. No agenda required.</p><div class="topicHero"><h2>Table Topics timer</h2><p>1:00 green · 1:30 yellow · 2:00 red</p><button class="button wide" onclick="configure('topics')">▶ Time next Table Topic</button></div><section class="panel"><div class="panelHead"><h2>Participants so far</h2><span class="tag">${entries.filter(e=>e.category==='Table Topics').length}</span></div>${entries.filter(e=>e.category==='Table Topics').length?entries.filter(e=>e.category==='Table Topics').map(e=>`<div class="reportItem"><span>${esc(e.name)}</span><b>${format(e.seconds)}</b></div>`).join(''):'<div class="empty">Table Topics results will appear here after each speech.</div>'}</section>`}
if(page==='ready'){let c=TYPES[type].category;let options=roster[c]?.map(x=>x.name)||[];let names=[...new Set([...options,...library.filter(x=>x.category===c).map(x=>x.name)])];body=`<div class="eyebrow">READY TO TIME</div><h1>${esc(TYPES[type].label)}</h1><p class="intro">Choose the name now or leave it blank and add it after the speech.</p><label class="field">Participant (optional)</label><input id="beforeName" value="${esc(chosen)}" oninput="chosen=this.value" placeholder="Choose later, if needed"><div class="resultChips">${names.map(n=>`<button onclick="selectName(decodeURIComponent('${encodeURIComponent(n)}'))">${esc(n)}</button>`).join('')}</div>${timingBar()}<div class="panel"><div class="panelHead"><h2>Adjust signals</h2><span class="tag">MM:SS</span></div><div class="custom">${[['green','g'],['yellow','y'],['red','r']].map(([n,k])=>`<label>${n}<input id="${n}Limit" inputmode="numeric" value="${format(limits[type][k])}"></label>`).join('')}</div><button class="button ghost wide" onclick="saveLimits()">Save time limits</button></div><button class="button wide" style="font-size:18px;min-height:60px" onclick="chosen=el('beforeName').value.trim();start()">▶ Start timer</button><p class="foot">Double-tap the color screen to stop. At 20 seconds past red, the screen alternates red and black. Your own small elapsed-time clock appears in the bottom-right corner.</p>`}
if(page==='result'){let cat=TYPES[type].category;let names=[...new Set([...(roster[cat]||[]).map(x=>x.name),...library.filter(x=>x.category===cat).map(x=>x.name)])];body=`<div class="eyebrow">TIMER STOPPED</div><h1>Save result</h1><div class="saveTime">${format(finished)}</div><p class="intro" style="text-align:center">${esc(TYPES[type].label)}</p><label class="field">Participant name</label><input id="resultName" placeholder="Participant ${entries.length+1}" value="${esc(chosen)}"><div class="resultChips">${names.map(n=>`<button onclick="selectResultName(decodeURIComponent('${encodeURIComponent(n)}'))">${esc(n)}</button>`).join('')}</div><button class="button wide" onclick="saveResult('${type==='topics'?'topics':'same'}')">✓ Save & next ${type==='topics'?'Table Topic':'participant'}</button><button class="button alt wide" onclick="saveResult('report')">Save & view report</button><button class="button ghost wide" onclick="setPage('setup')">Discard time</button>`}
if(page==='report'){body=`<div class="eyebrow">DURING OR AFTER THE MEETING</div><h1>Timer report</h1><p class="intro">A simple list of recorded times, grouped by meeting section. You can copy it for the Timer's report.</p>${CATS.map(c=>{let group=entries.filter(e=>e.category===c);return group.length?`<section class="reportSection"><h2 class="reportHeading">${c}</h2>${group.map(e=>`<div class="reportItem"><span>${esc(e.name)}</span><b>${format(e.seconds)}</b><button title="Edit name" onclick="renameEntry('${e.id}')">✎</button><button title="Delete" onclick="deleteEntry('${e.id}')">×</button></div>`).join('')}</section>`:''}).join('')||'<div class="empty">No recorded times yet.</div>'}<button class="button wide" onclick="copyReport()">Copy report</button><button class="button danger wide" onclick="eraseReport()">Clear recorded times</button>`}
a.innerHTML=top+body+'<p class="foot">Saved locally on this device. Prepared lineup and meeting report are stored separately.</p>'}
document.addEventListener('keydown',e=>{if(page==='signal'&&(e.key==='Escape'||e.key==='Enter'))stop()});render();
</script><script>if("serviceWorker" in navigator && location.protocol === "https:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></body></html>
