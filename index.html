k rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="logo.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><main id="app"></main><script>
const TYPES={speech:{label:'Prepared Speech',category:'Speakers',g:300,y:360,r:420},ice:{label:'Ice Breaker',category:'Speakers',g:240,y:300,r:360},eval:{label:'Evaluation',category:'Evaluators',g:120,y:150,r:180},topics:{label:'Table Topics',category:'Table Topics',g:60,y:90,r:120},general:{label:'General Evaluation',category:'General Evaluators',g:120,y:150,r:180}};
const CATS=['Speakers','Evaluators','Table Topics','General Evaluators'];
const store=(key,fallback)=>{try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
const historic=store('tm-speakers-v1',[]).map(x=>typeof x==='string'?{name:x,category:'Speakers'}:x).filter(x=>x&&CATS.includes(x.category)&&typeof x.name==='string');
let roster=store('tm-meeting-roster-v2',null);if(!roster||typeof roster!=='object')roster={Speakers:[],Evaluators:[]};for(let c of ['Speakers','Evaluators'])if(!Array.isArray(roster[c]))roster[c]=[];
let library=historic, oldPresets=store('tm-demo-presets',[]);let limits={};for(let k of Object.keys(TYPES)){let matching=oldPresets.find(x=>x.id===k);limits[k]={g:matching?.g??TYPES[k].g,y:matching?.y??TYPES[k].y,r:matching?.r??TYPES[k].r}};
let entries=store('tm-demo-entries',[]).map(e=>({...e,category:e.category||CATS.find(c=>c===e.type)||({speech:'Speakers',ice:'Speakers',eval:'Evaluators',topics:'Table Topics',general:'General Evaluators'}[e.type])||'Speakers'}));let page='setup',type='speech',chosen='',newNames={Speakers:'',Evaluators:''},current=0,started=0,finished=0,tick=null,lastTap=0,awake=null,customType='speech';
const el=id=>document.getElementById(id),format=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.max(0,n)%60).padStart(2,'0')}`,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('tm-meeting-roster-v2',JSON.stringify(roster));localStorage.setItem('tm-demo-entries',JSON.stringify(entries));localStorage.setItem('tm-speakers-v1',JSON.stringify(library));localStorage.setItem('tm-demo-presets',JSON.stringify(Object.entries(limits).map(([id,v])=>({id,...v}))))}

function add(c){const input=el('new'+(c==='Speakers'?'Speakers':'Evaluators'));let n=input?.value.trim();if(!n)return;roster[c].push({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),name:n,type:c==='Speakers'?'speech':'eval'});remember(n,c);chosen=n;persist();render()}
function remove(c,id){roster[c]=roster[c].filter(x=>x.id!==id);persist();render()}
function changeType(c,id,v){let x=roster[c].find(x=>x.id===id);if(x){x.type=v;persist();render()}}
function move(c,id,delta){let a=roster[c],i=a.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist();render()}
function setPage(p){page=p;render()}
function configure(k,who=''){type=k;chosen=who;page='ready';render()}
function configurePlanned(c,id){const person=roster[c].find(x=>x.id===id);if(person)configure(person.type,person.name)}
function start(){started=performance.now();current=0;lastTap=0;page='signal';render();tick=setInterval(()=>{current=Math.floor((performance.now()-started)/1000);const a=el('app');if(page==='signal'){a.className='signal '+signalColor();const clock=a.querySelector('.clock');if(clock)clock.textContent=format(current)}},100);try{navigator.wakeLock?.request('screen').then(x=>awake=x).catch(()=>{})}catch{}}
function signalColor(){let t=limits[type];return current>=t.r+20?((current-t.r-20)%2===0?'overtime-red':'overtime-black'):current>=t.r?'red':current>=t.y?'yellow':current>=t.g?'green':'neutral'}
function tap(){let now=performance.now();if(now-lastTap<420){stop()}else lastTap=now}
function stop(){if(page!=='signal')return;finished=Math.floor((performance.now()-started)/1000);clearInterval(tick);awake?.release?.().catch(()=>{});page='result';render()}
function saveResult(next){let n=el('resultName')?.value.trim()||'Participant '+(entries.length+1);let cat=TYPES[type].category;entries.push({id:String(Date.now())+Math.random(),name:n,type:TYPES[type].label,category:cat,seconds:finished,preset:type});remember(n,cat);persist();chosen='';if(next==='same'){page='ready'}else if(next==='topics'){page='topics'}else if(next==='report'){page='report'}else page='setup';render()}
function eraseReport(){if(confirm('Clear recorded times for this meeting? This will not delete your planned speakers.')){entries=[];persist();render()}}
function resetMeeting(){if(confirm('Clear today’s planned participants? Saved names remain available.')){roster={Speakers:[],Evaluators:[],'General Evaluators':[]};persist();render()}}
function copyReport(){let lines=['Toastmasters Timer Report'];for(let c of CATS){let items=entries.filter(e=>e.category===c);if(items.length)lines.push('',c,...items.map(e=>`${e.name} — ${format(e.seconds)}`))}const text=lines.join('\n');navigator.clipboard?.writeText(text).then(()=>alert('Report copied')).catch(()=>prompt('Copy report',text))||(!navigator.clipboard&&prompt('Copy report',text))}
function deleteEntry(id){entries=entries.filter(e=>e.id!==id);persist();render()}
function renameEntry(id){let e=entries.find(x=>x.id===id);if(!e)return;let name=prompt('Participant name',e.name);if(name?.trim()){e.name=name.trim();persist();render()}}
function selectResultName(n){el('resultName').value=n}
function inputTime(s){let a=s.split(':').map(Number);return a.length===2&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&a[0]>=0&&a[1]>=0&&a[1]<60?a[0]*60+a[1]:NaN}
function saveLimits(){let g=inputTime(el('greenLimit').value),y=inputTime(el('yellowLimit').value),r=inputTime(el('redLimit').value);if(![g,y,r].every(Number.isFinite)||!(g<y&&y<r)){alert('Enter valid MM:SS times, green before yellow before red');return}limits[type]={g,y,r};persist();render()}
function selectName(n){chosen=n;render()}
function timingBar(){let l=limits[type];return `<div class="signalTimes"><div><span class="dot green"></span>Green<b>${format(l.g)}</b></div><div><span class="dot yellow"></span>Yellow<b>${format(l.y)}</b></div><div><span class="dot red"></span>Red<b>${format(l.r)}</b></div></div>`}

let activeId=null, activeLimits=null, editing=null, dragId=null, overtime=store('tm-overtime',20);
roster['General Evaluators']=Array.isArray(roster['General Evaluators'])?roster['General Evaluators']:[];
const groups=['Speakers','Evaluators','General Evaluators'];
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
const lookup=id=>groups.flatMap(c=>roster[c]).find(x=>x.id===id);
const category=id=>groups.find(c=>roster[c].some(x=>x.id===id));
const done=x=>entries.find(e=>e.rosterId===x.id)||entries.find(e=>!e.rosterId&&e.name===x.name&&e.category===TYPES[x.type].category);
const range=l=>format(l.g)+'–'+format(l.r);
const status=(s,l)=>s<l.g?'short':s>l.r?'long':'ok';
function launch(k,id=null){type=k;activeId=id;let x=lookup(id);chosen=x?.name||'';activeLimits={...(x?.limits||limits[k])};start()}
function edit(id=null){editing=id;setPage('edit')}
function fields(l,p=''){return '<div class="custom">'+[['Green','g'],['Yellow','y'],['Red','r']].map(([n,k])=>'<label>'+n+'<input id="'+p+k+'" value="'+format(l[k])+'" inputmode="numeric"></label>').join('')+'</div>'}
function readTimes(p=''){let l={g:inputTime(el(p+'g').value),y:inputTime(el(p+'y').value),r:inputTime(el(p+'r').value)};if(!Object.values(l).every(Number.isFinite)||!(l.g<l.y&&l.y<l.r)){alert('Enter valid MM:SS times in increasing order.');return null}return l}
function changeEditType(){el('editTimes').innerHTML=fields(limits[el('editType').value])}
function savePerson(){let n=el('editName').value.trim(),k=el('editType').value,l=readTimes();if(!n){el('editName').focus();return}if(!l)return;let x=lookup(editing),c=TYPES[k].category;if(x){let old=category(editing);roster[old]=roster[old].filter(v=>v.id!==x.id);let updated={...x,name:n,type:k,limits:l};if(old===c){let pos=Number(el('editPosition').value)-1;roster[c].splice(Math.max(0,pos),0,updated)}else roster[c].push(updated)}else roster[c].push({id:uid(),name:n,type:k,limits:l});remember(n,c);persist();setPage('setup')}
function removePerson(){if(confirm('Remove this participant?')){let c=category(editing);roster[c]=roster[c].filter(x=>x.id!==editing);persist();setPage('setup')}}
function dropPerson(id){if(!dragId||dragId===id||category(dragId)!==category(id))return;let a=roster[category(id)],i=a.findIndex(x=>x.id===dragId),j=a.findIndex(x=>x.id===id);a.splice(j,0,a.splice(i,1)[0]);dragId=null;persist();render()}
function rowPerson(x){let e=done(x);return '<div class="meeting-row" draggable="true" ondragstart="dragId=\''+esc(x.id)+'\'" ondragover="event.preventDefault()" ondrop="event.preventDefault();dropPerson(\''+esc(x.id)+'\')"><button class="name-button" onclick="edit(\''+esc(x.id)+'\')">'+esc(x.name)+'<small>'+esc(TYPES[x.type].label)+' · '+range(x.limits||limits[x.type])+'</small></button>'+(e?'<span class="completed '+status(e.seconds,e.limits||x.limits||limits[x.type])+'">✓ '+format(e.seconds)+'</span>':'<button class="play" aria-label="Start timer" onclick="launch(\''+x.type+'\',\''+esc(x.id)+'\')">▶</button>')+'</div>'}

function saveResult(){let n=el('resultName').value.trim()||'Participant '+(entries.length+1),cat=TYPES[type].category;entries.push({id:uid(),rosterId:activeId,name:n,type:TYPES[type].label,category:cat,seconds:finished,preset:type,limits:{...activeLimits}});remember(n,cat);persist();activeId=null;setPage('setup')}
function signalColor(){let t=activeLimits||limits[type];return current>=t.r+overtime?((current-t.r-overtime)%2===0?'overtime-red':'overtime-black'):current>=t.r?'red':current>=t.y?'yellow':current>=t.g?'green':'neutral'}
function render(){let a=el('app');if(page==='signal'){a.className='signal '+signalColor();a.innerHTML='<div class="neutral-brand"><img src="./logo.png" alt="Toastmasters International"><div class="club-name">Volvo Group Toastmasters Gothenburg</div></div><span class="clock">'+format(current)+'</span>';a.onclick=tap;return}a.onclick=null;a.className='app';let top='<header class="meeting-header"><img src="./logo.png" alt=""><strong>Meeting Timer</strong><button class="icon-button" aria-label="Settings" onclick="setPage(\'settings\')">⚙</button></header>',body='',nav='<nav class="bottom-nav"><button class="'+(page==='setup'?'selected':'')+'" onclick="setPage(\'setup\')">◷ Meeting</button><button class="'+(page==='report'?'selected':'')+'" onclick="setPage(\'report\')">▤ Report</button></nav>';
if(page==='setup'){body='<h1>Today’s meeting</h1>'+groups.map(c=>'<section class="meeting-section"><h2>'+c+'</h2>'+(roster[c].length?roster[c].map(rowPerson).join(''):'<p class="muted">No participants added</p>')+'</section>').join('')+'<button class="button wide" onclick="launch(\'topics\')">▶ Table Topics</button><div class="muted center">'+entries.filter(e=>e.category==='Table Topics').length+' completed · '+range(limits.topics)+'</div><button class="button ghost wide" onclick="edit()">+ Add participant</button><details class="quick"><summary>Start without a name</summary>'+['speech','ice','eval','general'].map(k=>'<button class="button ghost wide" onclick="launch(\''+k+'\')">'+TYPES[k].label+'</button>').join('')+'</details>'}
if(page==='edit'){let x=lookup(editing),k=x?.type||'speech';body='<h1>'+(x?'Edit participant':'Add participant')+'</h1><label class="field">Name</label><input id="editName" list="savedNames" value="'+esc(x?.name||'')+'"><datalist id="savedNames">'+[...new Set(library.map(v=>v.name))].map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist><label class="field">Role</label><select id="editType" onchange="changeEditType()">'+Object.keys(TYPES).filter(v=>v!=='topics').map(v=>'<option value="'+v+'" '+(v===k?'selected':'')+'>'+TYPES[v].label+'</option>').join('')+'</select><details '+(x?'open':'')+'><summary>Time limits</summary><div id="editTimes">'+fields(x?.limits||limits[k])+'</div></details>'+(x?'<label class="field">Position in group</label><input id="editPosition" type="number" min="1" max="'+roster[category(editing)].length+'" value="'+(roster[category(editing)].findIndex(v=>v.id===editing)+1)+'">':'')+'<button class="button wide" onclick="savePerson()">Save participant</button><button class="button ghost wide" onclick="setPage(\'setup\')">Cancel</button>'+(x?'<button class="button danger wide" onclick="removePerson()">Remove participant</button>':'')}
if(page==='result'){let s=status(finished,activeLimits);body='<div class="center"><p class="muted">Speech completed</p><div class="saveTime">'+format(finished)+'</div><p class="'+s+'">'+({short:'Below minimum',long:'Over time',ok:'Within time limits'}[s])+'</p></div><label class="field">Participant</label><input id="resultName" list="resultNames" value="'+esc(chosen)+'" placeholder="Participant name"><datalist id="resultNames">'+library.filter(x=>x.category===TYPES[type].category).map(x=>'<option value="'+esc(x.name)+'">').join('')+'</datalist><button class="button wide" onclick="saveResult()">Save & continue</button><button class="button ghost wide" onclick="setPage(\'setup\')">Discard</button>'}
if(page==='report'){body='<h1>Timer report</h1>'+CATS.map(c=>{let g=entries.filter(e=>e.category===c);return g.length?'<section class="meeting-section"><h2>'+c+'</h2>'+g.map(e=>'<div class="meeting-row"><button class="name-button" onclick="renameEntry(\''+esc(e.id)+'\')">'+esc(e.name)+'</button><b class="'+status(e.seconds,e.limits||limits[e.preset]||limits.speech)+'">'+format(e.seconds)+'</b><button class="icon-button" aria-label="Delete result" onclick="if(confirm(\'Delete result?\'))deleteEntry(\''+esc(e.id)+'\')">×</button></div>').join('')+'</section>':''}).join('')+(entries.length?'':'<p class="muted">No recorded times yet.</p>')+'<button class="button wide" onclick="copyReport()">Copy report</button>'}
if(page==='settings'){body='<h1>Settings</h1><details><summary>Default time limits</summary>'+Object.keys(TYPES).map(k=>'<label class="field">'+TYPES[k].label+'</label>'+fields(limits[k],k)).join('')+'</details><details><summary>Overtime warning · '+overtime+' sec</summary><label class="field">Seconds after red</label><input type="number" min="0" id="overtime" value="'+overtime+'"></details><details><summary>Manage saved participants</summary>'+library.map((x,i)=>'<div class="meeting-row"><span>'+esc(x.name)+' · '+esc(x.category)+'</span><button class="icon-button" onclick="library.splice('+i+',1);persist();render()">×</button></div>').join('')+'</details><button class="button wide" onclick="saveDefaults()">Save settings</button><button class="button ghost wide" onclick="setPage(\'setup\')">Cancel</button><details><summary>Meeting data</summary><button class="button danger wide" onclick="newMeeting()">Start new meeting</button><button class="button ghost wide" onclick="eraseReport()">Clear report only</button><button class="button ghost wide" onclick="resetMeeting()">Clear planned lineup</button></details><p class="muted center">Toastmasters Timer 3.1 · Data stored on this device</p>'}
a.innerHTML=top+body+(['setup','report'].includes(page)?nav:'')}
document.addEventListener('keydown',e=>{if(page==='signal'&&(e.key==='Escape'||e.key==='Enter'))stop()});render();
</script><script>if("serviceWorker" in navigator && location.protocol === "https:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></body></html>
