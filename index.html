th:100%;font:inherit;padding:10px;border:1px solid #94a3b8;border-radius:10px;resize:vertical}.meeting-theme{font-weight:600;color:#004165}.meeting-qr{background:white;padding:20px;max-width:100%;width:max-content;margin:16px auto}.meeting-qr canvas,.meeting-qr img{max-width:100%;height:auto;image-rendering:pixelated}.agenda-time{min-width:36px;font-variant-numeric:tabular-nums}.meeting-row .name-button small{line-height:1.4}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="logo.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><main id="app"></main><script>
const TYPES={speech:{label:'Prepared Speech',category:'Speakers',g:300,y:360,r:420},ice:{label:'Ice Breaker',category:'Speakers',g:240,y:300,r:360},eval:{label:'Evaluation',category:'Evaluators',g:120,y:150,r:180},topics:{label:'Table Topics',category:'Table Topics',g:60,y:90,r:120},general:{label:'General Evaluation',category:'General Evaluators',g:120,y:150,r:180}};

const store=(key,fallback)=>{try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
const historic=store('tm-speakers-v1',[]).map(x=>typeof x==='string'?{name:x,category:'Speakers'}:x).filter(x=>x&&(CATS.includes(x.category)||x.category==='Meeting roles')&&typeof x.name==='string');
let roster=store('tm-meeting-roster-v2',null);if(!roster||typeof roster!=='object')roster={Speakers:[],Evaluators:[]};for(let c of ['Speakers','Evaluators'])if(!Array.isArray(roster[c]))roster[c]=[];
let library=historic, oldPresets=store('tm-demo-presets',[]);let limits={};for(let k of Object.keys(TYPES)){let matching=oldPresets.find(x=>x.id===k);limits[k]={g:matching?.g??TYPES[k].g,y:matching?.y??TYPES[k].y,r:matching?.r??TYPES[k].r}};
let entries=store('tm-demo-entries',[]).map(e=>({...e,category:e.category||CATS.find(c=>c===e.type)||({speech:'Speakers',ice:'Speakers',eval:'Evaluators',topics:'Table Topics',general:'General Evaluators'}[e.type])||'Speakers'}));let page='setup',type='speech',chosen='',newNames={Speakers:'',Evaluators:''},current=0,started=0,finished=0,tick=null,lastTap=0,awake=null,customType='speech';
const el=id=>document.getElementById(id),format=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.max(0,n)%60).padStart(2,'0')}`,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function remember(n,c){if(n&&!library.some(x=>x.category===c&&x.name.toLowerCase()===n.toLowerCase()))library.push({name:n,category:c})}
function add(c){const input=el('new'+(c==='Speakers'?'Speakers':'Evaluators'));let n=input?.value.trim();if(!n)return;roster[c].push({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),name:n,type:c==='Speakers'?'speech':'eval'});remember(n,c);chosen=n;persist();render()}
function remove(c,id){roster[c]=roster[c].filter(x=>x.id!==id);persist();render()}
function changeType(c,id,v){let x=roster[c].find(x=>x.id===id);if(x){x.type=v;persist();render()}}
function move(c,id,delta){let a=roster[c],i=a.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist();render()}
function setPage(p){page=p;render()}
function configure(k,who=''){type=k;chosen=who;page='ready';render()}
function configurePlanned(c,id){const person=roster[c].find(x=>x.id===id);if(person)configure(person.type,person.name)}
function start(){started=performance.now();current=0;lastTap=0;page='signal';render();tick=setInterval(()=>{current=Math.floor((performance.now()-started)/1000);const a=el('app');if(page==='signal'){a.className='signal '+signalColor();const clock=a.querySelector('.clock');if(clock)clock.textContent=format(current)}},100);try{navigator.wakeLock?.request('screen').then(x=>awake=x).catch(()=>{})}catch{}}
function signalColor(){let t=limits[type];return current>=t.r+20?((current-t.r-20)%2===0?'overtime-red':'overtime-black'):current>=t.r?'red':current>=t.y?'yellow':current>=t.g?'green':'neutral'}

function stop(){if(page!=='signal')return;finished=Math.floor((performance.now()-started)/1000);clearInterval(tick);awake?.release?.().catch(()=>{});page='result';render()}
function saveResult(next){let n=el('resultName')?.value.trim()||'Participant '+(entries.length+1);let cat=TYPES[type].category;entries.push({id:String(Date.now())+Math.random(),name:n,type:TYPES[type].label,category:cat,seconds:finished,preset:type});remember(n,cat);persist();chosen='';if(next==='same'){page='ready'}else if(next==='topics'){page='topics'}else if(next==='report'){page='report'}else page='setup';render()}
function eraseReport(){if(confirm('Clear recorded times for this meeting? This will not delete your planned speakers.')){entries=[];persist();render()}}
function resetMeeting(){if(confirm('Clear today’s planned participants? Saved names remain available.')){orderedAgenda=null;saveOrdered();meetingInfo=null;localStorage.removeItem('tm-meeting-info');roster={Speakers:[],Evaluators:[],'General Evaluators':[]};fillAgenda();persist();render()}}
function copyReport(){let lines=['Toastmasters Timer Report'];for(let c of CATS){let items=entries.filter(e=>e.category===c);if(items.length)lines.push('',c,...items.map(e=>`${e.category==='Meeting roles'&&e.name!==e.type?e.type+': ':''}${e.name} — ${format(e.seconds)}`))}const text=lines.join('\n');navigator.clipboard?.writeText(text).then(()=>alert('Report copied')).catch(()=>prompt('Copy report',text))||(!navigator.clipboard&&prompt('Copy report',text))}
function deleteEntry(id){entries=entries.filter(e=>e.id!==id);persist();render()}
function renameEntry(id){let e=entries.find(x=>x.id===id);if(!e)return;let name=prompt('Participant name',e.name);if(name?.trim()){e.name=name.trim();persist();render()}}
function selectResultName(n){el('resultName').value=n}
function inputTime(s){let a=s.split(':').map(Number);return a.length===2&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&a[0]>=0&&a[1]>=0&&a[1]<60?a[0]*60+a[1]:NaN}
function saveLimits(){let g=inputTime(el('greenLimit').value),y=inputTime(el('yellowLimit').value),r=inputTime(el('redLimit').value);if(![g,y,r].every(Number.isFinite)||!(g<y&&y<r)){alert('Enter valid MM:SS times, green before yellow before red');return}limits[type]={g,y,r};persist();render()}
function selectName(n){chosen=n;render()}
function timingBar(){let l=limits[type];return `<div class="signalTimes"><div><span class="dot green"></span>Green<b>${format(l.g)}</b></div><div><span class="dot yellow"></span>Yellow<b>${format(l.y)}</b></div><div><span class="dot red"></span>Red<b>${format(l.r)}</b></div></div>`}

let activeId=null, activeLimits=null, editing=null, dragId=null, overtime=store('tm-overtime',20);
roster['General Evaluators']=Array.isArray(roster['General Evaluators'])?roster['General Evaluators']:[];
const groups=['Speakers','Evaluators','General Evaluators'];
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
const roles=['Ah-Counter','Grammarian','Timer'];
function fillAgenda(){for(let [c,k,n] of [['Speakers','speech',3],['Evaluators','eval',3]]){while(roster[c].length<n)roster[c].push({id:uid(),name:'',type:k})}roster.roles=roster.roles||{};for(let r of roles)if(typeof roster.roles[r]!=='string')roster.roles[r]=''}
if(!store('tm-default-agenda-v32',false)){fillAgenda();persist();localStorage.setItem('tm-default-agenda-v32','true')}
if(!roster.roles){roster.roles={};for(let r of roles)roster.roles[r]=''}
function editRole(i){let r=roles[i],name=prompt(r+' name',roster.roles[r]);if(name!==null){roster.roles[r]=name.trim();remember(name.trim(),'Meeting roles');persist();render()}}
function launchRole(i){type='topics';activeId='role-'+i;chosen=roster.roles[roles[i]]||'';activeLimits={...limits.topics};start()}
function currentRole(){return roles.find((r,i)=>activeId==='role-'+i)}
function roleRows(){return '<section class="meeting-section"><h2>Meeting roles</h2>'+roles.map((r,i)=>{let e=entries.find(e=>e.rosterId==='role-'+i);return '<div class="meeting-row"><button class="name-button" onclick="editRole('+i+')">'+r+'<small>'+esc(roster.roles[r]||'Tap to assign')+' · '+range(limits.topics)+'</small></button>'+(e?'<span class="completed '+status(e.seconds,e.limits||limits.topics)+'">✓ '+format(e.seconds)+'</span>':'<button class="play" aria-label="Start '+r+' timer" onclick="launchRole('+i+')">▶</button>')+'</div>'}).join('')+'</section>'}
const lookup=id=>groups.flatMap(c=>roster[c]).find(x=>x.id===id);
const category=id=>groups.find(c=>roster[c].some(x=>x.id===id));
const done=x=>entries.find(e=>e.rosterId===x.id)||entries.find(e=>!e.rosterId&&e.name===x.name&&e.category===TYPES[x.type].category);
const range=l=>format(l.g)+'–'+format(l.r);

function launch(k,id=null){type=k;activeId=id;let x=lookup(id);chosen=x?.name||'';activeLimits={...(x?.limits||limits[k])};start()}
function edit(id=null){editing=id;setPage('edit')}
function fields(l,p=''){return '<div class="custom">'+[['Green','g'],['Yellow','y'],['Red','r']].map(([n,k])=>'<label>'+n+'<input id="'+p+k+'" value="'+format(l[k])+'" inputmode="numeric"></label>').join('')+'</div>'}
function readTimes(p=''){let l={g:inputTime(el(p+'g').value),y:inputTime(el(p+'y').value),r:inputTime(el(p+'r').value)};if(!Object.values(l).every(Number.isFinite)||!(l.g<l.y&&l.y<l.r)){alert('Enter valid MM:SS times in increasing order.');return null}return l}
function changeEditType(){el('editTimes').innerHTML=fields(limits[el('editType').value])}
function savePerson(){let n=el('editName').value.trim(),k=el('editType').value,l=readTimes();if(!n&&!lookup(editing)){el('editName').focus();return}if(!l)return;let x=lookup(editing),c=TYPES[k].category;if(x){let old=category(editing);roster[old]=roster[old].filter(v=>v.id!==x.id);let updated={...x,name:n,type:k,limits:l};if(old===c){let pos=Number(el('editPosition').value)-1;roster[c].splice(Math.max(0,pos),0,updated)}else roster[c].push(updated)}else roster[c].push({id:uid(),name:n,type:k,limits:l});remember(n,c);persist();setPage('setup')}

function clipboardAgenda(html){

   }
   let vals=cells.map(c=>safe(c.textContent));if(vals.some(Boolean))out.push('| '+vals.join(' | ')+' |');return;
  }
  if(node.tagName==='A'&&node.getAttribute('href')?.includes('view_meeting.php')&&safe(node.textContent)){out.push('[**'+safe(node.textContent)+'**]('+node.getAttribute('href')+')');return}

			this._elImage.style.display = "none";
			this._el.appendChild(this._elImage);
			this._bSupportDataURI = null;
		};
			
		/**
		 * Draw the QRCode
		 * 
		 * @param {QRCode} oQRCode 
		 */
		Drawing.prototype.draw = function (oQRCode) {
            var _elImage = this._elImage;
            var _oContext = this._oContext;
            var _htOption = this._htOption;
            
			var nCount = oQRCode.getModuleCount();
			var nWidth = _htOption.width / nCount;
			var nHeight = _htOption.height / nCount;
			var nRoundedWidth = Math.round(nWidth);
			var nRoundedHeight = Math.round(nHeight);

			_elImage.style.display = "none";
			this.clear();
			
			for (var row = 0; row < nCount; row++) {
				for (var col = 0; col < nCount; col++) {
					var bIsDark = oQRCode.isDark(row, col);
					var nLeft = col * nWidth;
					var nTop = row * nHeight;
					_oContext.strokeStyle = bIsDark ? _htOption.colorDark : _htOption.colorLight;
					_oContext.lineWidth = 1;
					_oContext.fillStyle = bIsDark ? _htOption.colorDark : _htOption.colorLight;					
					_oContext.fillRect(nLeft, nTop, nWidth, nHeight);
					
					// 안티 앨리어싱 방지 처리
					_oContext.strokeRect(
						Math.floor(nLeft) + 0.5,
						Math.floor(nTop) + 0.5,
						nRoundedWidth,
						nRoundedHeight
					);
					
					_oContext.strokeRect(
						Math.ceil(nLeft) - 0.5,
						Math.ceil(nTop) - 0.5,
						nRoundedWidth,
						nRoundedHeight
					);
				}
			}
			
			this._bIsPainted = true;
		};
			
		/**
		 * Make the image from Canvas if the browser supports Data URI.
		 */
		Drawing.prototype.makeImage = function () {
			if (this._bIsPainted) {
				_safeSetDataURI.call(this, _onMakeImage);
			}
		};
			
		/**
		 * Return whether the QRCode is painted or not
		 * 
		 * @return {Boolean}
		 */
		Drawing.prototype.isPainted = function () {
			return this._bIsPainted;
		};
		
		/**
		 * Clear the QRCode
		 */
		Drawing.prototype.clear = function () {
			this._oContext.clearRect(0, 0, this._elCanvas.width, this._elCanvas.height);
			this._bIsPainted = false;
		};
		
		/**
		 * @private
		 * @param {Number} nNumber
		 */
		Drawing.prototype.round = function (nNumber) {
			if (!nNumber) {
				return nNumber;
			}
			
			return Math.floor(nNumber * 1000) / 1000;
		};
		
		return Drawing;
	})();
	
	/**
	 * Get the type by string length
	 * 
	 * @private
	 * @param {String} sText
	 * @param {Number} nCorrectLevel
	 * @return {Number} type
	 */
	function _getTypeNumber(sText, nCorrectLevel) {			
		var nType = 1;
		var length = _getUTF8Length(sText);
		
		for (var i = 0, len = QRCodeLimitLength.length; i <= len; i++) {
			var nLimit = 0;
			
			switch (nCorrectLevel) {
				case QRErrorCorrectLevel.L :
					nLimit = QRCodeLimitLength[i][0];
					break;
				case QRErrorCorrectLevel.M :
					nLimit = QRCodeLimitLength[i][1];
					break;
				case QRErrorCorrectLevel.Q :
					nLimit = QRCodeLimitLength[i][2];
					break;
				case QRErrorCorrectLevel.H :
					nLimit = QRCodeLimitLength[i][3];
					break;
			}
			
			if (length <= nLimit) {
				break;
			} else {
				nType++;
			}
		}
		
		if (nType > QRCodeLimitLength.length) {
			throw new Error("Too long data");
		}
		
		return nType;
	}

	function _getUTF8Length(sText) {
		var replacedText = encodeURI(sText).toString().replace(/\%[0-9a-fA-F]{2}/g, 'a');
		return replacedText.length + (replacedText.length != sText ? 3 : 0);
	}
	
	/**
	 * @class QRCode
	 * @constructor
	 * @example 
	 * new QRCode(document.getElementById("test"), "http://jindo.dev.naver.com/collie");
	 *
	 * @example
	 * var oQRCode = new QRCode("test", {
	 *    text : "http://naver.com",
	 *    width : 128,
	 *    height : 128
	 * });
	 * 
	 * oQRCode.clear(); // Clear the QRCode.
	 * oQRCode.makeCode("http://map.naver.com"); // Re-create the QRCode.
	 *
	 * @param {HTMLElement|String} el target element or 'id' attribute of element.
	 * @param {Object|String} vOption
	 * @param {String} vOption.text QRCode link data
	 * @param {Number} [vOption.width=256]
	 * @param {Number} [vOption.height=256]
	 * @param {String} [vOption.colorDark="#000000"]
	 * @param {String} [vOption.colorLight="#ffffff"]
	 * @param {QRCode.CorrectLevel} [vOption.correctLevel=QRCode.CorrectLevel.H] [L|M|Q|H] 
	 */
	QRCode = function (el, vOption) {
		this._htOption = {
			width : 256, 
			height : 256,
			typeNumber : 4,
			colorDark : "#000000",
			colorLight : "#ffffff",
			correctLevel : QRErrorCorrectLevel.H
		};
		
		if (typeof vOption === 'string') {
			vOption	= {
				text : vOption
			};
		}
		
		// Overwrites options
		if (vOption) {
			for (var i in vOption) {
				this._htOption[i] = vOption[i];
			}
		}
		
		if (typeof el == "string") {
			el = document.getElementById(el);
		}

		if (this._htOption.useSVG) {
			Drawing = svgDrawer;
		}
		
		this._android = _getAndroid();
		this._el = el;
		this._oQRCode = null;
		this._oDrawing = new Drawing(this._el, this._htOption);
		
		if (this._htOption.text) {
			this.makeCode(this._htOption.text);	
		}
	};
	
	/**
	 * Make the QRCode
	 * 
	 * @param {String} sText link data
	 */
	QRCode.prototype.makeCode = function (sText) {
		this._oQRCode = new QRCodeModel(_getTypeNumber(sText, this._htOption.correctLevel), this._htOption.correctLevel);
		this._oQRCode.addData(sText);
		this._oQRCode.make();
		this._el.title = sText;
		this._oDrawing.draw(this._oQRCode);			
		this.makeImage();
	};
	
	/**
	 * Make the Image from Canvas element
	 * - It occurs automatically
	 * - Android below 3 doesn't support Data-URI spec.
	 * 
	 * @private
	 */
	QRCode.prototype.makeImage = function () {
		if (typeof this._oDrawing.makeImage == "function" && (!this._android || this._android >= 3)) {
			this._oDrawing.makeImage();
		}
	};
	
	/**
	 * Clear the QRCode
	 */
	QRCode.prototype.clear = function () {
		this._oDrawing.clear();
	};
	
	/**
	 * @name QRCode.CorrectLevel
	 */
	QRCode.CorrectLevel = QRErrorCorrectLevel;
})();
